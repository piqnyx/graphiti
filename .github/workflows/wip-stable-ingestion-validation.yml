name: WIP Stable Ingestion Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "graphiti_core/**"
      - "mcp_server/**"
      - ".github/workflows/wip-stable-ingestion-validation.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: "latest"
      - name: Install graphiti-core
        run: uv sync --all-extras
      - name: Typecheck changed core path
        run: uv run pyright graphiti_core/piqnyx_graphiti.py graphiti_core/llm_client/openai_generic_client.py
      - name: Core focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DISABLE_NEPTUNE: "1"
          DISABLE_NEO4J: "1"
          DISABLE_FALKORDB: "1"
          DISABLE_KUZU: "1"
        run: |
          uv run pytest -q \
            tests/llm_client/test_openai_generic_client.py \
            -p no:cacheprovider
      - name: Install MCP server and local core
        working-directory: mcp_server
        run: |
          uv sync
          uv pip install -e ..
      - name: MCP durability regressions
        working-directory: mcp_server
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/mcp_server/src
        run: |
          uv run pytest -q \
            tests/test_piqnyx_atomic_ingestion.py \
            tests/test_piqnyx_uuid_ingestion.py \
            tests/test_piqnyx_saga_state.py \
            -p no:cacheprovider
