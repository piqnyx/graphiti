name: piqnyx saga recovery validation

on:
  push:
    branches:
      - piqnyx/get-saga-state
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[falkordb]'
          pip install -e ./mcp_server
          pip install pytest pytest-asyncio
      - name: Compile fork overlays
        run: |
          python -m py_compile \
            mcp_server/main.py \
            mcp_server/src/piqnyx_saga_state_tool.py \
            mcp_server/src/models/response_types.py
      - name: Run fork saga tests
        working-directory: mcp_server
        run: pytest -q tests/test_piqnyx_saga_state_tool.py tests/test_piqnyx_uuid_ingestion.py tests/test_piqnyx_reliable_queue.py
