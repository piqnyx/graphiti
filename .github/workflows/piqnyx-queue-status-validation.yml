name: piqnyx queue status validation

on:
  push:
    branches: [piqnyx/queue-status]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: mcp_server
        run: uv sync
      - name: Run piqnyx queue and recovery tests
        working-directory: mcp_server
        run: >-
          uv run pytest -q -p no:cacheprovider
          tests/test_piqnyx_reliable_queue.py
          tests/test_piqnyx_queue_status_tool.py
          tests/test_piqnyx_saga_state_tool.py
          tests/test_piqnyx_saga_state.py
          tests/test_piqnyx_uuid_ingestion.py
