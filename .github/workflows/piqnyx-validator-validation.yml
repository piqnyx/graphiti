name: piqnyx falkor validator validation

on:
  push:
    branches:
      - piqnyx/falkor-validator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'falkordb>=1.1.2,<2.0.0' pytest ruff

      - name: Compile
        run: python -m py_compile tools/falkor_validate.py tests/tools/test_falkor_validate.py

      - name: Ruff
        run: python -m ruff check tools/falkor_validate.py tests/tools/test_falkor_validate.py

      - name: Validator unit tests
        run: python -m pytest -q --confcutdir=tests/tools tests/tools/test_falkor_validate.py
